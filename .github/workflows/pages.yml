name: Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

# One deployment at a time: a newer run replaces a queued run but never cancels a running one.
# Pull requests get their own group so they can never replace a queued deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    outputs:
      sha256sums: ${{ steps.hash.outputs.sha256sums }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false # no dependencies, no lockfile

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # npm test already builds twice in one process. This rebuild runs in a new process with another time zone
      # and locale, so output that depends on the environment fails here.
      - name: Check the build is reproducible
        run: |
          mv dist "$RUNNER_TEMP/dist-first"
          env TZ=Pacific/Chatham LANG=tr_TR.UTF-8 LC_ALL=tr_TR.UTF-8 node scripts/build.mjs --quiet
          diff -r "$RUNNER_TEMP/dist-first" dist

      # The run summary lists the hashes, so anyone can compare them with the live site.
      - name: Hash the built files
        id: hash
        working-directory: dist
        run: |
          sums=$(sha256sum -- *)
          printf 'sha256sums<<SHA256SUMS_EOF\n%s\nSHA256SUMS_EOF\n' "$sums" >> "$GITHUB_OUTPUT"
          printf '### sha256 of the built files\n\n```\n%s\n```\n' "$sums" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write # create the Pages deployment
      id-token: write # OIDC token that proves which workflow and branch the deployment comes from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Signed SLSA build provenance for every built file. There is no checkout and no repository code in this job:
  # it signs the hashes from the build job. Attestations need a public repository (private ones need GitHub
  # Enterprise Cloud), so a private repository skips this job instead of failing.
  provenance:
    name: Attest provenance
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the attestation in this repository
    steps:
      - name: Write the checksums file
        env:
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: printf '%s\n' "$SHA256SUMS" > "$RUNNER_TEMP/sha256sums.txt"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/sha256sums.txt
